<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บอร์ดประชาสัมพันธ์ โรงเรียนพระมารดานิจจานุเคราะห์</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --primary: #00A878;
  --primary-dark: #007A57;
  --primary-light: #E0F7F1;
  --accent: #FF6B6B;
  --accent2: #FFD166;
  --accent3: #4ECDC4;
  --blue: #118AB2;
  --purple: #845EC2;
  --bg: #F0F9F6;
  --surface: #FFFFFF;
  --border: rgba(0,168,120,0.15);
  --text: #1A2E2A;
  --text-soft: #5A7A74;
  --shadow: 0 4px 24px rgba(0,168,120,0.12);
  --shadow-lg: 0 12px 48px rgba(0,168,120,0.18);
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== BG DECORATION ===== */
body::before {
  content: '';
  position: fixed;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,168,120,0.08) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -150px; left: -150px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(78,205,196,0.07) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* ===== TOPBAR ===== */
.topbar {
  background: linear-gradient(135deg, #007A57 0%, #00A878 50%, #00BFA5 100%);
  color: #fff;
  padding: 0 2rem;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 4px 20px rgba(0,122,87,0.35);
}

.topbar::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent3), var(--primary));
}

.topbar-brand { display: flex; align-items: center; gap: 14px; }

.school-logo {
  width: 44px; height: 44px;
  background: rgba(255,255,255,0.2);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.3);
  flex-shrink: 0;
}

.topbar-title {
  font-family: 'Mitr', sans-serif;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.topbar-sub {
  font-size: 11px;
  opacity: 0.8;
  margin-top: 1px;
  letter-spacing: 0.02em;
}

.topbar-actions { display: flex; gap: 8px; align-items: center; }

.btn-topbar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  font-family: 'Sarabun', sans-serif;
  transition: all 0.2s;
  border: none; white-space: nowrap;
}

.btn-login {
  background: rgba(255,255,255,0.15);
  color: #fff;
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.3);
}
.btn-login:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }

.btn-add-ev {
  background: var(--accent2);
  color: #7A5500;
  display: none;
}
.btn-add-ev:hover { background: #ffc429; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,209,102,0.5); }

.btn-add-tc {
  background: var(--accent3);
  color: #065450;
  display: none;
}
.btn-add-tc:hover { background: #3ab8af; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(78,205,196,0.5); }

/* ===== NAV TABS ===== */
.nav-tabs {
  background: var(--surface);
  border-bottom: 1.5px solid var(--border);
  padding: 0 2rem;
  display: flex;
  gap: 0;
  position: sticky; top: 68px; z-index: 40;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}

.nav-tab {
  padding: 14px 22px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  color: var(--text-soft);
  border-bottom: 3px solid transparent;
  background: none;
  border-top: none; border-left: none; border-right: none;
  font-family: 'Sarabun', sans-serif;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.2s;
  white-space: nowrap;
  position: relative;
}
.nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.nav-tab:hover:not(.active) { color: var(--primary); background: var(--primary-light); }

.nav-tab .tab-badge {
  background: var(--primary);
  color: #fff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 99px;
  font-weight: 700;
}

/* ===== PAGES ===== */
.page { display: none; padding: 2rem; position: relative; z-index: 1; }
.page.active { display: block; }
.container { max-width: 1140px; margin: 0 auto; }

/* ===== STATS ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 1.75rem;
}

.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
  border: 1.5px solid var(--border);
  transition: all 0.25s;
  position: relative; overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.stat-card:nth-child(1)::before { background: linear-gradient(90deg, var(--primary), var(--accent3)); }
.stat-card:nth-child(2)::before { background: linear-gradient(90deg, var(--blue), var(--purple)); }
.stat-card:nth-child(3)::before { background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.stat-card:nth-child(4)::before { background: linear-gradient(90deg, var(--accent3), var(--primary)); }
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }

.stat-num {
  font-family: 'Mitr', sans-serif;
  font-size: 32px; font-weight: 700;
  color: var(--primary);
  line-height: 1;
}
.stat-label { font-size: 12px; color: var(--text-soft); margin-top: 5px; font-weight: 500; }

/* ===== CALENDAR TOOLBAR ===== */
.cal-toolbar {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  flex-wrap: wrap; gap: 10px;
}

.month-nav { display: flex; align-items: center; gap: 12px; }

.month-nav button {
  width: 38px; height: 38px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 16px; color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.month-nav button:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  transform: scale(1.05);
}

.month-label {
  font-family: 'Mitr', sans-serif;
  font-size: 20px; font-weight: 600;
  color: var(--text);
  min-width: 200px; text-align: center;
}

.btn-toggle-view {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  color: var(--primary);
  cursor: pointer;
  font-family: 'Sarabun', sans-serif;
  transition: all 0.2s;
}
.btn-toggle-view:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* ===== CALENDAR GRID ===== */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.cal-hcell {
  text-align: center;
  font-size: 12px; font-weight: 700;
  color: var(--text-soft);
  padding: 8px 0;
  font-family: 'Mitr', sans-serif;
  letter-spacing: 0.04em;
}
.cal-hcell.sat { color: var(--blue); }
.cal-hcell.sun { color: var(--accent); }

.cal-day {
  min-height: 88px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  padding: 8px;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.2s;
}
.cal-day:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-2px); }
.cal-day.other-month { background: rgba(240,249,246,0.5); opacity: 0.5; }
.cal-day.today {
  border-color: var(--primary);
  border-width: 2px;
  background: linear-gradient(135deg, var(--primary-light) 0%, #fff 100%);
  box-shadow: 0 0 0 3px rgba(0,168,120,0.1);
}
.cal-day.saturday { background: #F0F5FF; border-color: #D0E2FF; }
.cal-day.saturday .day-num { color: var(--blue); }
.cal-day.sunday, .cal-day.holiday { background: #FFF3F3; border-color: #FFD0D0; }
.cal-day.sunday .day-num, .cal-day.holiday .day-num { color: var(--accent); }

.day-num {
  font-family: 'Mitr', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--text);
  margin-bottom: 5px;
}
.cal-day.today .day-num {
  background: var(--primary);
  color: #fff;
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}

.holiday-lbl {
  font-size: 9px;
  color: var(--accent);
  background: rgba(255,107,107,0.1);
  padding: 2px 5px;
  border-radius: 4px;
  margin-bottom: 4px;
  font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border: 1px solid rgba(255,107,107,0.2);
}

.ev-dot {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 3px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ev-dot span { font-size: 10px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }

/* ===== FILTER BAR ===== */
.filter-bar {
  display: flex; gap: 8px;
  flex-wrap: wrap; align-items: center;
  margin-bottom: 1.25rem;
}

.fchip {
  font-size: 12px;
  padding: 6px 16px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer; color: var(--text-soft);
  font-family: 'Sarabun', sans-serif; font-weight: 600;
  transition: all 0.2s;
}
.fchip.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 3px 10px rgba(0,168,120,0.3); }
.fchip:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* ===== EVENT CARDS ===== */
.ev-list { display: flex; flex-direction: column; gap: 12px; }

.ev-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex; align-items: flex-start; gap: 16px;
  transition: all 0.25s;
  position: relative; overflow: hidden;
}
.ev-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 4px 0 0 4px;
}
.ev-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: rgba(0,168,120,0.3); }

.ev-left {
  display: flex; flex-direction: column;
  align-items: center;
  min-width: 56px;
  background: linear-gradient(135deg, var(--primary-light), #fff);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center; flex-shrink: 0;
}

.ev-day {
  font-family: 'Mitr', sans-serif;
  font-size: 26px; font-weight: 700;
  color: var(--primary); line-height: 1;
}
.ev-month-lbl { font-size: 10px; color: var(--text-soft); margin-top: 4px; font-weight: 600; }

.ev-body { flex: 1; min-width: 0; }
.ev-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.4; }

.dept-badge {
  font-size: 11px;
  padding: 3px 12px;
  border-radius: 99px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.ev-desc { font-size: 13px; color: var(--text-soft); margin-top: 6px; line-height: 1.6; }

.file-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--blue);
  background: rgba(17,138,178,0.08);
  padding: 5px 12px;
  border-radius: 8px;
  text-decoration: none; margin-top: 8px;
  font-weight: 600;
  border: 1px solid rgba(17,138,178,0.2);
  transition: all 0.2s;
}
.file-chip:hover { background: rgba(17,138,178,0.15); }

.btn-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-ic {
  background: none; border: none; cursor: pointer;
  padding: 8px; border-radius: var(--radius-sm);
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; color: #bbb;
}
.btn-ic.edit:hover { color: var(--blue); background: rgba(17,138,178,0.1); }
.btn-ic.del:hover { color: var(--accent); background: rgba(255,107,107,0.1); }

.empty-state {
  text-align: center; padding: 5rem 1rem;
  color: #bbb; font-size: 14px;
}
.empty-state i { color: #ddd; }

/* ===== TEACHER SECTION ===== */
.teacher-toolbar {
  display: flex; gap: 10px;
  flex-wrap: wrap; align-items: center;
  margin-bottom: 1.75rem;
}

.search-box {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  flex: 1; min-width: 220px; max-width: 440px;
  transition: all 0.2s;
}
.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(0,168,120,0.1);
}
.search-box i { color: var(--primary); font-size: 18px; flex-shrink: 0; }
.search-box input {
  border: none; outline: none;
  font-family: 'Sarabun', sans-serif; font-size: 14px;
  background: none; width: 100%; color: var(--text);
}

.teacher-type-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

.tt-tab {
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer;
  color: var(--text-soft);
  font-family: 'Sarabun', sans-serif;
  transition: all 0.2s;
}
.tt-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 3px 10px rgba(0,168,120,0.3); }
.tt-tab:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

.teacher-count { font-size: 13px; color: var(--text-soft); white-space: nowrap; padding-top: 4px; font-weight: 500; }

.teacher-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px; margin-bottom: 1.75rem;
}

.teacher-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 14px;
}

.t-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: all 0.25s;
  cursor: pointer;
  position: relative; overflow: hidden;
}
.t-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent3));
  opacity: 0; transition: opacity 0.2s;
}
.t-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: rgba(0,168,120,0.3);
  transform: translateY(-3px);
}
.t-card:hover::after { opacity: 1; }

.t-card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }

.t-avatar {
  width: 54px; height: 54px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Mitr', sans-serif;
  font-size: 17px; font-weight: 700; color: #fff;
  flex-shrink: 0; overflow: hidden;
  box-shadow: 0 4px 12px rgba(0,168,120,0.3);
}
.t-avatar.retired { background: linear-gradient(135deg, #EF9F27, #C47A12); box-shadow: 0 4px 12px rgba(239,159,39,0.35); }
.t-avatar.foreign { background: linear-gradient(135deg, #118AB2, #0A5C7A); box-shadow: 0 4px 12px rgba(17,138,178,0.35); }

.t-name { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.35; }
.t-code { font-size: 11px; color: var(--text-soft); margin-top: 3px; font-weight: 500; }

.t-badge {
  display: inline-block; font-size: 10px;
  padding: 2px 10px;
  border-radius: 99px; margin-top: 4px; font-weight: 700;
  letter-spacing: 0.02em;
}
.t-badge.retired { background: #FEF3C7; color: #92400E; border: 1px solid #F6D860; }
.t-badge.foreign { background: #DBEAFE; color: #1E40AF; border: 1px solid #BFDBFE; }

.t-info { font-size: 12px; color: var(--text-soft); display: flex; flex-direction: column; gap: 5px; }
.t-info-row { display: flex; align-items: flex-start; gap: 7px; }
.t-info-row i { font-size: 14px; color: var(--primary); flex-shrink: 0; margin-top: 1px; }

/* ===== MODALS ===== */
.tmodal-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: flex-start; justify-content: center;
  z-index: 200; padding: 1.5rem; overflow-y: auto;
  backdrop-filter: blur(4px);
}
.tmodal {
  background: var(--surface);
  border-radius: 20px;
  width: 100%; max-width: 540px;
  padding: 2.25rem;
  box-shadow: 0 24px 80px rgba(0,0,0,0.25);
  position: relative; margin: auto;
  border: 1.5px solid var(--border);
}

.tmodal-close {
  position: absolute; top: 16px; right: 16px;
  background: #f5f5f5; border: none; cursor: pointer;
  font-size: 18px; color: #888;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px; transition: all 0.2s;
}
.tmodal-close:hover { background: #ffe0e0; color: var(--accent); }

.tmodal-avatar {
  width: 86px; height: 86px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Mitr', sans-serif;
  font-size: 28px; font-weight: 700; color: #fff;
  margin: 0 auto 1rem; overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,168,120,0.35);
}
.tmodal-avatar.retired {
  background: linear-gradient(135deg, #EF9F27, #C47A12);
  box-shadow: 0 8px 24px rgba(239,159,39,0.35);
}
.tmodal-avatar.foreign {
  background: linear-gradient(135deg, #118AB2, #0A5C7A);
  box-shadow: 0 8px 24px rgba(17,138,178,0.35);
}

.tmodal-name { text-align: center; font-family: 'Mitr', sans-serif; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.tmodal-code { text-align: center; font-size: 13px; color: var(--text-soft); margin-bottom: 1.25rem; }

.tmodal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.tmodal-field {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  border: 1px solid var(--border);
}
.tmodal-field label {
  display: block; font-size: 10px; color: var(--text-soft);
  margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
}
.tmodal-field p { font-size: 13px; color: var(--text); font-weight: 500; }
.tmodal-field.full { grid-column: 1/-1; }

/* Form Modal */
.modal-wrap {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 1rem;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--surface);
  border-radius: 20px;
  width: 100%; max-width: 520px;
  padding: 2rem; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.2);
  border: 1.5px solid var(--border);
}
.modal h3 {
  font-family: 'Mitr', sans-serif;
  font-size: 18px; font-weight: 600;

    showToast(`🎉 ยินดีต้อนรับ ${user.displayName}`);
    loadTeachersData();
  } else {
    loginBtn.innerHTML = `<i class="ti ti-login"></i> <span id="login-text">เข้าสู่ระบบ</span>`;
    loginBtn.style.background = 'rgba(255,255,255,0.15)';
    loginBtn.style.borderColor = 'rgba(255,255,255,0.3)';
    document.getElementById('btn-add-event').style.display = 'none';
    document.getElementById('btn-add-teacher').style.display = 'none';
    AppState.teachers = [];
    if (!isEventPage) renderTeachers();
  }
  if (isEventPage) renderAllEvents();
});

async function initData() {
  try {
    const eventsSnapshot = await db.collection('events').get();
    AppState.events = eventsSnapshot.docs.map(doc => doc.data());
    document.getElementById('loading-overlay').style.display = 'none';
    renderAllEvents();
  } catch (error) {
    console.error("Error loading events:", error);
    document.getElementById('loading-overlay').style.display = 'none';
  }
}

async function loadTeachersData() {
  if (!AppState.user) return;
  try {
    const snap = await db.collection('teachers').get();
    AppState.teachers = snap.docs.map(doc => doc.data());
    if (document.getElementById('page-teachers').classList.contains('active')) {
      renderTeacherStats();
      renderTeachers();
    }
  } catch (error) { console.error("Error loading teachers:", error); }
}

function renderStats() {
  const now = new Date();
  const thisMonth = AppState.events.filter(e => {
    const d = new Date(e.date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  const depts = [...new Set(AppState.events.map(e => e.dept))];
  const upcoming = AppState.events.filter(e => new Date(e.date) >= new Date(now.toDateString()));
  const container = document.getElementById('stats-bar');
  const statData = [
    { num: AppState.events.length, label: 'กิจกรรมทั้งหมด', icon: '📌' },
    { num: thisMonth.length, label: 'เดือนนี้', icon: '📅' },
    { num: upcoming.length, label: 'กิจกรรมที่จะมาถึง', icon: '🔔' },
    { num: depts.length, label: 'ฝ่ายที่เกี่ยวข้อง', icon: '🏢' }
  ];
  container.innerHTML = statData.map(s =>
    `<div class="stat-card"><div class="stat-num">${s.num}</div><div class="stat-label">${s.icon} ${s.label}</div></div>`
  ).join('');
}

function renderCalendar() {
  const hdr = document.getElementById('cal-header');
  hdr.innerHTML = CONSTANTS.DAYS_TH.map((d, i) =>
    `<div class="cal-hcell${i===0?' sun':i===6?' sat':''}">${d}</div>`
  ).join('');

  document.getElementById('month-label').textContent = `${CONSTANTS.MONTHS_TH[AppState.ui.curMonth]} ${AppState.ui.curYear + 543}`;

  const first = new Date(AppState.ui.curYear, AppState.ui.curMonth, 1).getDay();
  const days = new Date(AppState.ui.curYear, AppState.ui.curMonth + 1, 0).getDate();
  const today = new Date();
  const calGrid = document.getElementById('cal-grid');
  let html = '';

  for (let i = 0; i < first; i++) {
    const d = new Date(AppState.ui.curYear, AppState.ui.curMonth, 0 - first + i + 2);
    html += `<div class="cal-day other-month"><div class="day-num">${d.getDate()}</div></div>`;
  }

  for (let d = 1; d <= days; d++) {
    const isToday = today.getFullYear()===AppState.ui.curYear && today.getMonth()===AppState.ui.curMonth && today.getDate()===d;
    const ds = `${AppState.ui.curYear}-${String(AppState.ui.curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const shortDs = `${String(AppState.ui.curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvts = AppState.events.filter(e => e.date===ds || (e.endDate && ds>=e.date && ds<=e.endDate));
    const dots = dayEvts.slice(0,2).map(e => `<div class="ev-dot"><div class="dot" style="background:${e.color}"></div><span>${e.name}</span></div>`).join('');
    const more = dayEvts.length > 2 ? `<div style="font-size:9px;color:var(--text-soft)">+${dayEvts.length-2} อื่นๆ</div>` : '';
    const holidayName = CONSTANTS.HOLIDAYS_TH[ds] || CONSTANTS.HOLIDAYS_TH[shortDs];
    const dow = new Date(AppState.ui.curYear, AppState.ui.curMonth, d).getDay();
    let cls = 'cal-day';
    if (holidayName) cls += ' holiday';
    else if (dow===0) cls += ' sunday';
    else if (dow===6) cls += ' saturday';
    if (isToday) cls += ' today';
    const hBadge = holidayName ? `<div class="holiday-lbl" title="${holidayName}">${holidayName}</div>` : '';
    html += `<div class="${cls}" onclick="jumpToDay('${ds}')"><div class="day-num">${d}</div>${hBadge}${dots}${more}</div>`;
  }
  calGrid.innerHTML = html;
}

function jumpToDay(ds) {
  AppState.ui.calMode = false;
  document.getElementById('cal-view').style.display = 'none';
  document.getElementById('list-section').style.display = 'block';
  document.getElementById('cal-toggle').innerHTML = '<i class="ti ti-calendar"></i> ดูปฏิทิน';
  AppState.ui.filterDept = 'all';
  renderFilters();
  renderList(ds);
}

function toggleCalView() {
  AppState.ui.calMode = !AppState.ui.calMode;
  document.getElementById('cal-view').style.display = AppState.ui.calMode ? 'block' : 'none';
  document.getElementById('list-section').style.display = AppState.ui.calMode ? 'none' : 'block';
  document.getElementById('cal-toggle').innerHTML = AppState.ui.calMode ? '<i class="ti ti-list"></i> ดูรายการ' : '<i class="ti ti-calendar"></i> ดูปฏิทิน';
  if (!AppState.ui.calMode) renderList();
}

function renderFilters() {
  const depts = [...new Set(AppState.events.map(e => e.dept))];
  const bar = document.getElementById('filter-bar');
  let html = `<button class="fchip${AppState.ui.filterDept==='all'?' active':''}" onclick="setFilter('all',this)">ทั้งหมด</button>`;
  depts.forEach(d => {
    html += `<button class="fchip${AppState.ui.filterDept===d?' active':''}" onclick="setFilter('${d.replace(/'/g,"\\'") }',this)">${d}</button>`;
  });
  bar.innerHTML = html;
  const dl = document.getElementById('dept-list');
  if (dl) dl.innerHTML = depts.map(d => `<option value="${esc(d)}">`).join('');
}

function setFilter(dept, btn) {
  AppState.ui.filterDept = dept;
  document.querySelectorAll('#filter-bar .fchip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList(focusDate=null) {
  const lv = document.getElementById('ev-list');
  let evts = [...AppState.events].sort((a,b) => a.date.localeCompare(b.date));
  if (AppState.ui.filterDept !== 'all') evts = evts.filter(e => e.dept === AppState.ui.filterDept);
  if (focusDate) evts = evts.filter(e => e.date===focusDate || (e.endDate && focusDate>=e.date && focusDate<=e.endDate));
  lv.innerHTML = '';
  if (!evts.length) {
    lv.innerHTML = `<div class="empty-state"><i class="ti ti-calendar-off" style="font-size:40px;display:block;margin-bottom:12px"></i>ยังไม่มีกิจกรรม</div>`;
    return;
  }
  lv.innerHTML = evts.map(e => {
    const d = new Date(e.date);
    const range = e.endDate && e.endDate !== e.date ? ` — ${new Date(e.endDate).getDate()} ${CONSTANTS.MONTHS_TH[new Date(e.endDate).getMonth()].slice(0,3)}` : '';
    const chip = e.drive ? `<a class="file-chip" href="${esc(e.drive)}" target="_blank" rel="noopener"><i class="ti ti-file" style="font-size:12px"></i> เปิดไฟล์ Google Drive</a>` : '';
    const actions = AppState.user ? `<div class="btn-actions"><button class="btn-ic edit" onclick="openEventModal('${e.id}')" title="แก้ไข"><i class="ti ti-edit"></i></button><button class="btn-ic del" onclick="confirmDelete('${e.id}','event')" title="ลบ"><i class="ti ti-trash"></i></button></div>` : '';
    return `<div class="ev-card" style="border-left:4px solid ${e.color}">
      <div class="ev-left"><div class="ev-day">${d.getDate()}</div><div class="ev-month-lbl">${CONSTANTS.MONTHS_TH[d.getMonth()].slice(0,3)} ${d.getFullYear()+543}${range}</div></div>
      <div class="ev-body">
        <div class="ev-title">${esc(e.name)}</div>
        <div style="margin-top:5px"><span class="dept-badge" style="background:${e.color}20;color:${e.color};border:1px solid ${e.color}40">${esc(e.dept)}</span></div>
        ${e.desc ? `<div class="ev-desc">${esc(e.desc)}</div>` : ''}
        ${chip}
      </div>${actions}</div>`;
  }).join('');
}

function changeMonth(d) {
  AppState.ui.curMonth += d;
  if (AppState.ui.curMonth > 11) { AppState.ui.curMonth = 0; AppState.ui.curYear++; }
  if (AppState.ui.curMonth < 0) { AppState.ui.curMonth = 11; AppState.ui.curYear--; }
  renderCalendar();
}

function openEventModal(id=null) {
  AppState.ui.editId = id;
  document.getElementById('event-modal-wrap').style.display = 'block';
  document.getElementById('ev-modal-title').textContent = id ? 'แก้ไขกิจกรรม' : 'เพิ่มกิจกรรมใหม่';
  if (id) {
    const e = AppState.events.find(ev => ev.id === id);
    document.getElementById('f-name').value = e.name;
    document.getElementById('f-dept').value = e.dept;
    document.getElementById('f-date').value = e.date;
    document.getElementById('f-end').value = e.endDate || '';
    document.getElementById('f-desc').value = e.desc || '';
    document.getElementById('f-drive').value = e.drive || '';
    AppState.ui.selColor = e.color;
  } else {
    ['f-name','f-dept','f-desc','f-drive'].forEach(fid => document.getElementById(fid).value = '');
    document.getElementById('f-date').value = '';
    document.getElementById('f-end').value = '';
    AppState.ui.selColor = CONSTANTS.COLORS[0];
  }
  renderColorPicker();
  updateDrivePreview();
}

function closeEventModal() { document.getElementById('event-modal-wrap').style.display = 'none'; AppState.ui.editId = null; }

function renderColorPicker() {
  document.getElementById('color-swatches').innerHTML = CONSTANTS.COLORS.map(c =>
    `<div class="cswatch${c===AppState.ui.selColor?' selected':''}" style="background:${c}" onclick="AppState.ui.selColor='${c}';renderColorPicker()"></div>`
  ).join('');
}

function updateDrivePreview() {
  const url = document.getElementById('f-drive').value.trim();
  const prev = document.getElementById('f-preview');
  if (url) {
    prev.style.display = 'flex';
    const isPdf = url.toLowerCase().includes('pdf') || url.includes('/d/');
    prev.innerHTML = `<i class="ti ti-${isPdf?'file-type-pdf':'photo'}" style="font-size:18px;color:${isPdf?'var(--accent)':'var(--blue)'}"></i><span>${isPdf?'PDF':'รูปภาพ'} — ${url.slice(0,50)}</span>`;
  } else { prev.style.display = 'none'; }
}

async function saveEvent() {
  if (!AppState.user) return showToast('กรุณาเข้าสู่ระบบก่อน', 'error');
  const name = document.getElementById('f-name').value.trim();
  const dept = document.getElementById('f-dept').value.trim();
  const date = document.getElementById('f-date').value;
  if (!name || !dept || !date) return showToast('กรุณากรอกข้อมูลที่จำเป็น', 'error');
  const endDate = document.getElementById('f-end').value;
  if (endDate && endDate < date) return showToast('วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่ม', 'error');
  const ev = {
    id: AppState.ui.editId || uid(), name, dept, date, endDate,
    desc: document.getElementById('f-desc').value.trim(),
    drive: document.getElementById('f-drive').value.trim(),
    color: AppState.ui.selColor
  };
  try {
    await db.collection('events').doc(ev.id).set(ev);
    if (AppState.ui.editId) AppState.events = AppState.events.map(e => e.id===AppState.ui.editId ? ev : e);
    else AppState.events.push(ev);
    closeEventModal(); renderAllEvents();
    showToast(AppState.ui.editId ? '✏️ แก้ไขกิจกรรมแล้ว' : '✅ เพิ่มกิจกรรมแล้ว');
  } catch (error) { showToast('บันทึกข้อมูลล้มเหลว: ' + error.message, 'error'); }
}

function renderTeacherStats() {
  const thai = AppState.teachers.filter(t => t.type==='thai');
  const retired = AppState.teachers.filter(t => t.type==='retired');
  const foreign = AppState.teachers.filter(t => t.type==='foreign');
  const stats = [
    { num: AppState.teachers.length, label: 'บุคลากรทั้งหมด', icon: '👥', color: 'var(--primary)' },
    { num: thai.length, label: 'ครูไทย', icon: '🇹🇭', color: 'var(--primary)' },
    { num: retired.length, label: 'ครูเกษียณ', icon: '🎓', color: '#C47A12' },
    { num: foreign.length, label: 'ครูต่างชาติ', icon: '🌏', color: 'var(--blue)' }
  ];
  document.getElementById('teacher-stats-bar').innerHTML = stats.map(s =>
    `<div class="stat-card"><div class="stat-num" style="color:${s.color}">${s.num}</div><div class="stat-label">${s.icon} ${s.label}</div></div>`
  ).join('');
}

function setTeacherType(type, btn) {
  AppState.ui.teacherType = type;
  document.querySelectorAll('.tt-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderTeachers();
}

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(' ');
  if (parts.length >= 2) return parts[parts.length-2].charAt(0) + (parts[parts.length-1] ? parts[parts.length-1].charAt(0) : '');
  return name.charAt(0).toUpperCase();
}

function renderTeachers() {
  const grid = document.getElementById('teacher-grid');
  const toolbar = document.querySelector('.teacher-toolbar');
  const statsBar = document.getElementById('teacher-stats-bar');

  if (!AppState.user) {
    if(toolbar) toolbar.style.display = 'none';
    if(statsBar) statsBar.style.display = 'none';
    grid.innerHTML = `<div class="lock-screen">
      <div class="lock-icon-wrap">🔒</div>
      <div class="lock-title">ข้อมูลสงวนสิทธิ์เฉพาะบุคลากร</div>
      <div class="lock-desc">กรุณาเข้าสู่ระบบด้วยบัญชี Google เพื่อดูทะเบียนข้อมูลครู</div>
    </div>`;
    return;
  }

  if(toolbar) toolbar.style.display = 'flex';
  if(statsBar) statsBar.style.display = 'grid';

  const q = document.getElementById('teacher-search').value.trim().toLowerCase();
  AppState.pool = AppState.teachers.filter(t => {
    if (AppState.ui.teacherType !== 'all' && t.type !== AppState.ui.teacherType) return false;
    if (q) {
      const fullName = `${t.name} ${t.surname} ${t.code} ${t.subject} ${t.major} ${t.role} ${t.nationality||''}`.toLowerCase();
      return fullName.includes(q);
    }
    return true;
  });

  document.getElementById('teacher-count').textContent = `พบ ${AppState.pool.length} คน`;
  grid.innerHTML = '';

  if (!AppState.pool.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-user-off" style="font-size:40px;display:block;margin-bottom:12px"></i>ไม่พบข้อมูลครู</div>`;
    return;
  }

  grid.innerHTML = AppState.pool.map((t, i) => {
    const avatarClass = `t-avatar${t.type==='retired'?' retired':t.type==='foreign'?' foreign':''}`;
    const initials = t.type==='foreign' ? t.name.split(' ').filter(w=>w).map(w=>w[0]).join('').slice(0,2) : getInitials(t.name+' '+t.surname);
    const badge = t.type==='retired' ? `<span class="t-badge retired">ครูเกษียณ ${t.retiredYear||''}</span>` : t.type==='foreign' ? `<span class="t-badge foreign">${t.nationality||'Foreign'}</span>` : '';
    return `<div class="t-card" data-idx="${i}">
      <div class="t-card-header">
        <div class="${avatarClass}">${initials}</div>
        <div>
          <div class="t-name">${esc(t.name)}${t.surname?' '+esc(t.surname):''}</div>
          <div class="t-code">รหัส ${t.code} • อายุ ${t.age} ปี</div>
          ${badge}
        </div>
      </div>
      <div class="t-info">
        ${t.subject ? `<div class="t-info-row"><i class="ti ti-book"></i><span>${esc(t.subject)}${t.level?' ('+esc(t.level)+')':''}</span></div>` : ''}
        ${t.role ? `<div class="t-info-row"><i class="ti ti-building"></i><span>${esc(t.role)}</span></div>` : ''}
        ${t.major ? `<div class="t-info-row"><i class="ti ti-school"></i><span>${esc(t.major)}</span></div>` : ''}
        ${t.phone && t.phone!=='-' ? `<div class="t-info-row"><i class="ti ti-phone"></i><span>${esc(t.phone)}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

document.getElementById('teacher-grid').addEventListener('click', function(e) {
  const card = e.target.closest('.t-card');
  if (!card) return;
  const idx = parseInt(card.dataset.idx);
  if (!isNaN(idx)) showTeacherDetail(idx);
});

function showTeacherDetail(idx) {
  const t = AppState.pool[idx];
  if (!t) return;
  const avatarClass = `tmodal-avatar${t.type==='retired'?' retired':t.type==='foreign'?' foreign':''}`;
  const initials = t.type==='foreign' ? t.name.split(' ').filter(w=>w).map(w=>w[0]).join('').slice(0,2) : getInitials(t.name+' '+t.surname);
  const badge = t.type==='retired' ? `<span class="t-badge retired" style="font-size:12px;padding:4px 14px">ครูเกษียณ ${t.retiredYear||''}</span>` : t.type==='foreign' ? `<span class="t-badge foreign" style="font-size:12px;padding:4px 14px">${t.nationality||'Foreign'}</span>` : '';
  const actionBtns = AppState.user ? `
    <button class="fchip" style="display:inline-flex;align-items:center;gap:5px" onclick="openTeacherEditModal('${t.id}')"><i class="ti ti-edit"></i> แก้ไข</button>
    <button class="fchip" style="display:inline-flex;align-items:center;gap:5px;color:var(--accent);border-color:var(--accent)" onclick="closeTeacherModal();confirmDelete('${t.id}','teacher')"><i class="ti ti-trash"></i> ลบ</button>` : '';
  document.getElementById('tmodal-body').innerHTML = `
    <div class="${avatarClass}">${initials}</div>
    <div class="tmodal-name">${esc(t.name)}${t.surname?' '+esc(t.surname):''}</div>
    <div class="tmodal-code">รหัส ${t.code} ${badge}</div>
    <div style="height:1px;background:var(--border);margin:1.25rem 0"></div>
    <div class="tmodal-grid">
      <div class="tmodal-field"><label>วุฒิการศึกษา</label><p>${esc(t.edu)||'-'}</p></div>
      <div class="tmodal-field"><label>สาขาวิชาเอก</label><p>${esc(t.major)||'-'}</p></div>
      <div class="tmodal-field"><label>วิชาที่สอน</label><p>${esc(t.subject)||'-'}</p></div>
      <div class="tmodal-field"><label>ระดับชั้น</label><p>${esc(t.level)||'-'}</p></div>
      ${t.role ? `<div class="tmodal-field full"><label>งาน/หน้าที่</label><p>${esc(t.role)}</p></div>` : ''}
      <div class="tmodal-field"><label>อายุ</label><p>${t.age||'-'} ปี</p></div>
      <div class="tmodal-field"><label>วันเริ่มทำงาน</label><p>${esc(t.start)||'-'}</p></div>
      <div class="tmodal-field"><label>เบอร์โทรศัพท์</label><p>${t.phone && t.phone!=='-' ? `<a href="tel:${esc(t.phone)}" style="color:var(--primary);text-decoration:none">${esc(t.phone)}</a>` : '-'}</p></div>
      ${t.nationality ? `<div class="tmodal-field"><label>สัญชาติ</label><p>${esc(t.nationality)}</p></div>` : ''}
      ${t.retiredYear ? `<div class="tmodal-field"><label>ปีที่เกษียณ</label><p>${esc(t.retiredYear)}</p></div>` : ''}
    </div>`;
  document.getElementById('tmodal-actions').innerHTML = actionBtns;
  document.getElementById('teacher-modal-wrap').style.display = 'block';
}

function closeTeacherModal() { document.getElementById('teacher-modal-wrap').style.display = 'none'; }

  document.getElementById('tf-retired-wrap').style.display = type==='retired' ? 'block' : 'none';
}

document.getElementById('tf-type').addEventListener('change', function() { toggleTeacherTypeFields(this.value); });

function closeTeacherEditModal() { document.getElementById('teacher-edit-modal-wrap').style.display = 'none'; AppState.ui.editTeacherId = null; }

async function saveTeacher() {
  if (!AppState.user) return showToast('กรุณาเข้าสู่ระบบก่อน', 'error');
  const name = document.getElementById('tf-name').value.trim();
  const code = document.getElementById('tf-code').value.trim();
  const type = document.getElementById('tf-type').value;
  if (!name || !code) return showToast('กรุณากรอกชื่อและรหัสครู', 'error');
  const obj = {
    id: AppState.ui.editTeacherId || uid(), type, code, name,
    surname: document.getElementById('tf-surname').value.trim(),
    age: parseInt(document.getElementById('tf-age').value)||0,
    edu: document.getElementById('tf-edu').value.trim(),
    major: document.getElementById('tf-major').value.trim(),
    subject: document.getElementById('tf-subject').value.trim(),
    level: document.getElementById('tf-level').value.trim(),
    role: document.getElementById('tf-role').value.trim(),
    phone: document.getElementById('tf-phone').value.trim(),
    start: document.getElementById('tf-start').value.trim(),
    nationality: document.getElementById('tf-nationality').value.trim(),
    retiredYear: document.getElementById('tf-retired').value.trim(),
  };
  try {
    await db.collection('teachers').doc(obj.id).set(obj);
    if (AppState.ui.editTeacherId) AppState.teachers = AppState.teachers.map(t => t.id===AppState.ui.editTeacherId ? obj : t);
    else AppState.teachers.push(obj);
    closeTeacherEditModal();
    renderTeacherStats();
    renderTeachers();
    showToast(AppState.ui.editTeacherId ? '✏️ แก้ไขข้อมูลครูแล้ว' : '✅ เพิ่มข้อมูลครูแล้ว');
  } catch (error) { showToast('บันทึกข้อมูลล้มเหลว: ' + error.message, 'error'); }
}

function confirmDelete(id, type='event') {
  AppState.ui.pendingDelId = { id, type };
  document.getElementById('confirm-msg').textContent = type==='teacher' ? 'ยืนยันการลบข้อมูลครูคนนี้?' : 'ยืนยันการลบกิจกรรมนี้?';
  document.getElementById('confirm-wrap').style.display = 'block';
  document.getElementById('confirm-del-btn').onclick = async () => {
    if (!AppState.user) return showToast('ไม่มีสิทธิ์ลบข้อมูล', 'error');
    try {
      if (type==='event') {
        await db.collection('events').doc(id).delete();
        AppState.events = AppState.events.filter(e => e.id !== id);
        renderAllEvents();
        showToast('🗑️ ลบกิจกรรมแล้ว');
      } else {
        await db.collection('teachers').doc(id).delete();
        AppState.teachers = AppState.teachers.filter(t => t.id !== id);
        renderTeacherStats();
        renderTeachers();
        showToast('🗑️ ลบข้อมูลครูแล้ว');
      }
    } catch (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); }
    closeConfirm();
  };
}

function closeConfirm() { document.getElementById('confirm-wrap').style.display = 'none'; AppState.ui.pendingDelId = null; }

function renderAllEvents() { renderStats(); renderCalendar(); if (!AppState.ui.calMode) renderList(); renderFilters(); }

function switchPage(name, btn) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
  if (AppState.user) {
    document.getElementById('btn-add-event').style.display = name==='events' ? 'flex' : 'none';
    document.getElementById('btn-add-teacher').style.display = name==='teachers' ? 'flex' : 'none';
  } else {
    document.getElementById('btn-add-event').style.display = 'none';
    document.getElementById('btn-add-teacher').style.display = 'none';
  }
  if (name==='teachers') { renderTeacherStats(); renderTeachers(); }
}

window.onload = () => { initData(); };
</script>
</body>
</html>
